<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="geo" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="transparent"/>
      <!-- grid -->
      <path d="M50 0V100M0 50H100" stroke="#c9a86c" stroke-width="0.8" opacity="0.35"/>
      <path d="M0 0L100 100M100 0L0 100" stroke="#c9a86c" stroke-width="0.7" opacity="0.28"/>
      <!-- 8-point star -->
      <path d="M50 6 L61 34 L90 45 L61 56 L50 84 L39 56 L10 45 L39 34 Z"
            fill="none" stroke="#c9a86c" stroke-width="1.6" opacity="0.9"/>
      <!-- inner star -->
      <path d="M50 22 L57 38 L74 45 L57 52 L50 68 L43 52 L26 45 L43 38 Z"
            fill="#c9a86c" fill-opacity="0.12" stroke="#c9a86c" stroke-width="1.1" opacity="0.85"/>
      <!-- corner diamonds -->
      <path d="M0 0 L12 0 L0 12 Z" fill="#c9a86c" fill-opacity="0.22"/>
      <path d="M100 0 L88 0 L100 12 Z" fill="#c9a86c" fill-opacity="0.22"/>
      <path d="M0 100 L12 100 L0 88 Z" fill="#c9a86c" fill-opacity="0.22"/>
      <path d="M100 100 L88 100 L100 88 Z" fill="#c9a86c" fill-opacity="0.22"/>
      <!-- hex accents -->
      <circle cx="50" cy="45" r="2.8" fill="#c9a86c" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#geo)"/>
</svg>
